name: CI

# Every push and pull request runs the tests.
# Build and deploy jobs are added in step 3, once the GCP project exists.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests -q
